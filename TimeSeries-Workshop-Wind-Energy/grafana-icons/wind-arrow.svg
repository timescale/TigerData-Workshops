<?xml version="1.0" encoding="UTF-8"?>
<!-- Wind vector glyph for the Grafana geomap markers layer.
     Points STRAIGHT UP (north) at rotation 0, because Grafana rotates the symbol
     clockwise by the bound field's value in degrees — so rotation = compass bearing
     puts the head on that bearing. The shaft is offset so the arrow rotates about
     its centre rather than its tail, keeping it visually anchored on the plant. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <!-- head -->
    <polygon points="50,6 74,44 58,44 58,50 42,50 42,44 26,44"/>
    <!-- shaft -->
    <rect x="42" y="50" width="16" height="44" rx="3"/>
  </g>
</svg>
